[project]
name = "weft-engine"
version = "0.1.0"
description = "The backend engine for Weft matching and related operations."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.146.0,<0.147.0",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "sqlalchemy[asyncio]>=2.0.48,<3.0",
    "asyncpg>=0.31,<1.0",
    "alembic>=1.18,<2.0",
    "openai>=2.30,<3.0",
    "ortools>=9.14,<10.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2,<3.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.0,<0.18.0"
mypy = ">=2.4.0,<3.0.0"
pytest = ">=9.1.0,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
httpx = ">=0.28.1,<0.29.0"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
pythonpath = [".", "scripts"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
