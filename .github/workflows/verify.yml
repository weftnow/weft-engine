name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Validate dependency metadata
        run: poetry check --lock --strict
      - name: Install locked dependencies
        run: poetry sync --no-interaction
      - name: Verify
        run: make verify
